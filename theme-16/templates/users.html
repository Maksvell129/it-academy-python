{% extends "base.html" %}

{% block content %}

<h1>List of all users</h1>

<a href="{{ url_for('users.create_user') }}">
    Add user
</a>




<ul>
    {% for user in users %}
        <li>
            <a href="{{ url_for('users.user_detail', user_id=user.id) }}">
                {{ user.name }}
            </a>

            — {{ user.email }}

                    <form
            method="post"
            action="{{ url_for(
                'users.delete_user',
                user_id=user.id
            ) }}"
        >
            <button type="submit">
                Delete
            </button>
        </form>

        </li>
    {% endfor %}
</ul>

{% endblock %}
